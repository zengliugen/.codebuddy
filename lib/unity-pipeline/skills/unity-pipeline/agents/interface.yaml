interface:
  display_name: "Unity 管线驱动"
  short_description: "打开 Unity 项目并经 CLI 驱动运行中的 Editor 或 Player 执行命令、测试与重载"
  default_prompt: "使用 $unity-pipeline 打开或驱动 Unity 实例。先校验 CLI 安装，再按命令分组执行编译、测试或代码重载。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "打开.*Unity"
      - keyword: "启动.*Unity 项目"
      - keyword: "unity pipeline"
      - keyword: "Unity.*重编译"
      - keyword: "Unity.*测试"
      - keyword: "Unity.*代码重载"
  execution:
    context: "inline"
    shell: "powershell"
    environment:
      python: ">=3.8"
      unity_cli: ">=0.9.0"
    artifacts:
      - "SKILL.md"
      - "references/commands.md"
      - "agents/interface.yaml"
  trust:
    source_tier: "plugin"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: "unity-pipeline"
version: "2.0"
mode: "Production"
source:
  origin: "local"
  upstream: "com.unity.pipeline 0.9.0-exp.1"
  vendor_root: "lib/unity-pipeline"
  editable: "full"
  maintenance_note: "源出上游 com.unity.pipeline 0.9.0-exp.1，自 2.0 起转为本项目本地维护分支：正文（SKILL.md、规则、references）已全部中文化，受 rules/core/core-language 语言规则约束；reports/ 下为脚本生成产物，随生成脚本的英文标题输出，不计入正文语言范围。"
