interface:
  display_name: "拷问快捷入口"
  short_description: "模型不可直接调用的转发入口，统一转到 grilling 技能"
  default_prompt: "使用 $grill-me 转发到 grilling 技能执行拷问流程。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "grill me"
      - keyword: "拷问我"
  execution:
    context: "inline"
    shell: "powershell"
    environment:
      python: ">=3.8"
    artifacts:
      - "SKILL.md"
      - "agents/interface.yaml"
  trust:
    source_tier: "plugin"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: "grill-me"
version: "1.0"
mode: "Production"
source:
  origin: "third-party"
  vendor_root: "lib/grilling"
  editable: "metadata-only"
