interface:
  display_name: "C# Test Coverage"
  short_description: "检查指定目录/文件/包的 C# 测试覆盖率，输出未覆盖成员清单并可生成测试骨架"
  default_prompt: "使用 $csharp-test-coverage 检查目标目录或文件的 C# 测试覆盖率。直接将用户指定的路径传递给技能，无需预扫描或分析文件列表。扫描完成后必须询问是否生成 Test 骨架（默认不生成）。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "测试覆盖率"
      - keyword: "覆盖率.*检查"
      - keyword: "哪些.*没有测试"
      - keyword: "未覆盖"
      - keyword: "零测试"
  execution:
    context: "inline"
    shell: "bash"
    environment:
      dotnet_sdk: ">=10.0"
      python: ">=3.8"
      unity_cli: ">=1.0.0-beta（仅真实采集需要）"
    artifacts:
      - "SKILL.md"
      - "scripts/check_coverage.py"
      - "scripts/collect_real_coverage.py"
      - "scripts/parse_unity_coverage.py"
      - "tools/CSharpTestCoverage/"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
