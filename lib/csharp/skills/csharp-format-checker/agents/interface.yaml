interface:
  display_name: "C# 格式检查"
  short_description: "基于 dotnet format 与项目根 .editorconfig 检查或修复 C# 代码格式"
  default_prompt: "使用 $csharp-format-checker 检查 C# 代码格式。默认 check 模式只检查不修改，传入用户指定的目录或文件路径即可。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "检查.*格式"
      - keyword: "格式化.*代码"
      - keyword: "dotnet format"
      - keyword: "格式.*合规"
      - keyword: "代码风格"
  execution:
    context: "inline"
    shell: "powershell"
    environment:
      dotnet_sdk: ">=6.0"
      python: ">=3.8"
    artifacts:
      - "SKILL.md"
      - "scripts/dotnet_format.py"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: csharp-format-checker
version: "0.1"
mode: Production
