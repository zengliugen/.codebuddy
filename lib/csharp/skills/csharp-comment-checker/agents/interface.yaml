interface:
  display_name: "C# Comment Checker"
  short_description: "检查 C# 代码的 XML 文档注释和行内注释合规性"
  default_prompt: "使用 $csharp-comment-checker 检查目标目录或文件的 C# 注释合规情况。直接将用户指定的路径传递给技能，无需预扫描或分析文件列表。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "检查.*注释"
      - keyword: "注释.*合规"
      - keyword: "扫描.*注释"
      - keyword: "注释.*检查"
  execution:
    context: "inline"
    shell: "bash"
    environment:
      dotnet_sdk: ">=10.0"
      python: ">=3.8"
    artifacts:
      - "SKILL.md"
      - "scripts/check_comments.py"
      - "tools/CSharpCommentChecker/"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
