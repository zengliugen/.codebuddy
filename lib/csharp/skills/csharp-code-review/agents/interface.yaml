interface:
  display_name: "C# 代码审查入口"
  short_description: "识别 C# 代码审查请求并调度 csharp-code-review Agent，本技能不执行审查逻辑"
  default_prompt: "使用 $csharp-code-review 审查 C# 代码。直接传入用户指定的目标（文件、目录、Git 变更范围或代码片段），由审查 Agent 按规则执行。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "审查.*C#"
      - keyword: "C#.*代码审查"
      - keyword: "review.*变更"
      - keyword: "审查.*[.]cs"
      - keyword: "检查.*代码质量"
  execution:
    context: "fork"
    shell: "powershell"
    environment:
      dotnet_sdk: ">=10.0"
      python: ">=3.8"
    artifacts:
      - "SKILL.md"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: csharp-code-review
version: "1.1"
mode: Production
