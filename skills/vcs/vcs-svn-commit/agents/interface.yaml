interface:
  display_name: "SVN 提交执行"
  short_description: "分析 SVN 工作副本变更、生成标准化提交摘要，并在提交前执行代码审查门禁"
  default_prompt: "使用 $vcs-svn-commit 提交 SVN 变更。分析工作副本变更并生成标准化摘要，提交前按项目配置执行审查门禁，再以显式目标清单提交。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "svn commit"
      - keyword: "提交到 svn"
      - keyword: "提交到 Subversion"
      - keyword: "svn 提交"
  execution:
    context: "inline"
    shell: "powershell"
    environment:
      python: ">=3.8"
    artifacts:
      - "SKILL.md"
      - "scripts/collect_svn_changes.py"
      - "scripts/verify_targets.py"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: vcs-svn-commit
version: "1.0"
mode: Production
