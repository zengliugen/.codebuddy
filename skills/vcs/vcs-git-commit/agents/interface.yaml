interface:
  display_name: "Git 提交执行"
  short_description: "分析 Git 变更、生成标准化提交摘要，并在提交前执行代码审查门禁"
  default_prompt: "使用 $git-commit 提交 Git 变更。分析变更并生成标准化摘要，提交前按项目配置执行审查门禁后再暂存提交。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "git commit"
      - keyword: "提交代码"
      - keyword: "提交.*变更"
      - keyword: "commit.*改动"
  execution:
    context: "inline"
    shell: "powershell"
    environment:
      python: ">=3.8"
    artifacts:
      - "SKILL.md"
      - "scripts/verify_staged.py"
      - "agents/interface.yaml"
      - "../../vcs-router/scripts/validate_commit_subject.py"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: vcs-git-commit
version: "1.10"
mode: Production
