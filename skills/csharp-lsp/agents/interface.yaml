interface:
  display_name: "C# LSP"
  short_description: "csharp-ls 环境检查与 C# 代码智能（跳转定义、查找引用、符号检索）"
  default_prompt: "使用 $csharp-lsp 技能：先运行环境检查脚本确认 csharp-ls 与 csharp-lsp 插件就绪，再通过 LSP 工具获取 C# 代码智能。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "csharp-lsp.*(检查|生效|可用|不可用)"
      - keyword: "(跳转|查看|定位|查找|找).*(定义|声明)"
      - keyword: "(查找|查|搜索|看看).*(引用|调用|被谁)"
      - keyword: "(悬停|类型信息|签名|文档注释).*查询"
      - keyword: "(接口|抽象).*(实现|实现类)"
      - keyword: "(调用链|调用层级|调用树)"
      - keyword: "(文件|文档).*符号(结构|列表)"
      - keyword: "(工作区|全局|跨文件).*(符号|类|方法).*(搜索|查找|检索)"
      - keyword: "LSP.*(不可用|报错|错误|失效)"
      - keyword: "C#.*(代码智能|智能提示|跳转)"
  execution:
    context: "inline"
    shell: "bash"
    environment:
      dotnet_sdk: ">=6.0"
      python: ">=3.8"
      csharp_ls: ">=0.26.0"
    artifacts:
      - "SKILL.md"
      - "scripts/check_env.py"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"

input:
  project_path:
    description: "项目绝对路径（环境检查默认取当前工作目录）"
    type: "string"
    required: false
  target_file:
    description: "目标 .cs 文件绝对路径（LSP 操作对象）"
    type: "string"
    required: false
    validation: "must exist on filesystem"

output:
  format:
    - type: "env_report"
      description: "环境检查结果：csharp-ls 安装状态 + csharp-lsp 插件安装/启用/加载状态，含修复指引"
    - type: "lsp_result"
      description: "LSP 操作返回的符号/定义/引用/悬停信息"

boundary:
  inclusions:
    - "csharp-ls 语言服务器安装检查"
    - "csharp-lsp 插件安装/开启检查"
    - "LSP 代码智能操作（goToDefinition、findReferences、hover、goToImplementation、documentSymbol、workspaceSymbol、prepareCallHierarchy、incomingCalls、outgoingCalls）"
  exclusions:
    - "不修改源代码（本技能只查询，不编辑）"
    - "不替代 csharp-code / csharp-comment / unity-pipeline"
    - "不检查 Unity 编译错误（由 unity-pipeline 的 recompile 负责）"
  constraints:
    - "仅支持 .cs 文件（插件 extensionToLanguage 仅映射 .cs）"
    - "LSP 操作需先经 ToolSearch 加载 LSP 工具"
    - "line 与 character 使用 1-based 索引；所有操作均须传这两个参数，无位置概念的操作（documentSymbol、workspaceSymbol）传 1"
    - "环境检查结果带本地缓存（技能目录 .cache/，按项目隔离）：24 小时内且环境指纹未变化时复用上次通过结论；环境变化自动失效，强制重查加 --no-cache"
  limitations:
    - "csharp-ls 首次冷启动索引大型工程较慢"
    - "LSP 结果为空时需回退 Grep/Read 手动查找"
