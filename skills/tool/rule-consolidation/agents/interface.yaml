interface:
  display_name: "规则文件重组"
  short_description: "按入口加子规则模式拆分、合并或评估 .codebuddy 规则文件结构"
  default_prompt: "使用 $rule-consolidation 重组规则文件。指定目标规则目录与操作意图（拆分/合并/评估）。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "拆分.*规则"
      - keyword: "合并.*规则"
      - keyword: "规则.*结构"
      - keyword: "子规则.*太多"
      - keyword: "入口.*子规则"
  execution:
    context: "fork"
    shell: "powershell"
    environment:
      python: ">=3.8"
    artifacts:
      - "SKILL.md"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: rule-consolidation
version: "1.0"
mode: Production
