interface:
  display_name: "引擎同步"
  short_description: "更新引擎仓库并把版本间的项目侧契约变化落实到项目侧"
  default_prompt: "使用 $engine-sync 更新引擎并同步项目侧。先分析影响清单，经确认后落实，最后跑三项验证。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "更新.*引擎.*同步"
      - keyword: "引擎.*更新.*项目侧"
      - keyword: "升级.*codebuddy"
      - keyword: "同步.*引擎.*修改"
      - keyword: "引擎.*新技能.*提示"
  execution:
    context: "fork"
    shell: "powershell"
    environment:
      python: ">=3.8"
    artifacts:
      - "SKILL.md"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: engine-sync
version: "1.0"
mode: Production
