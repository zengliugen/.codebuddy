interface:
  display_name: "CMD Batch Script Writing"
  short_description: "编写与修复 Windows CMD 批处理脚本，规避 UTF-8 中文乱码与 goto 作用域陷阱"
  default_prompt: "使用 $cmd-script-writing 编写或修复 Windows CMD 批处理脚本。若脚本含中文输出，必须遵循 UTF-8 行尾 ASCII 规范（含中文行末尾补空格）规避乱码；括号块内避免 goto；正确处理路径参数的去引号与尾部反斜杠。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "写.*cmd.*脚本"
      - keyword: "写.*bat.*脚本"
      - keyword: "修复.*cmd.*乱码"
      - keyword: "cmd.*中文乱码"
      - keyword: "is not recognized"
      - keyword: "批处理.*goto"
      - keyword: "硬链接.*脚本"
      - keyword: "mklink"
      - keyword: "批处理.*脚本"
  execution:
    context: "inline"
    shell: "bash"
    environment:
      none
    artifacts:
      - "SKILL.md"
      - "references/utf8-garbled.md"
      - "references/goto-pitfall.md"
      - "references/path-handling.md"
      - "scripts/check_cmd_trailing.py"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"

input:
  task:
    description: "脚本编写或修复任务；可提供脚本用途、目标平台（Windows CMD）、是否含中文输出、输入输出参数"
    type: "string"
    required: true
  script_path:
    description: "要修复的既有 .cmd/.bat 脚本路径；仅修复场景需要"
    type: "string"
    required: false
  output_encoding:
    description: "输出脚本的编码；默认 UTF-8 无 BOM（符合项目语言规范），行尾 CRLF"
    type: "string"
    required: false
    default: "utf-8-no-bom"

output:
  format: "batch-script"
  artifact:
    - "可运行的 .cmd/.bat 脚本，中文输出正常（行尾 ASCII 规避乱码）"
    - "修复场景：诊断报告 + 修复后的脚本代码"
    - "校验器扫描结果（check_cmd_trailing.py 输出，确认无行尾中文风险）"
  summary:
    - "脚本路径或修复内容"
    - "已应用的关键规范（UTF-8 行尾、goto 规避、路径处理）"
    - "验证结果（校验器通过 + 实际运行确认无 is not recognized 报错）"

exclusions:
  - "PowerShell 脚本（.ps1）"
  - "Python / Bash / Linux shell 脚本"
  - "业务逻辑设计（非脚本语法与编码问题）"
  - "已生成的 Generate/Gen 目录代码"
