interface:
  display_name: "CMD Batch Script Writing"
  short_description: "编写与修复 Windows CMD 批处理脚本，规避 UTF-8 中文乱码与 goto 作用域陷阱"
  default_prompt: "使用 $cmd-script-writing 编写或修复 Windows CMD 批处理脚本。若脚本含中文输出，必须遵循 UTF-8 行尾 ASCII 规范（含中文行末尾补空格）规避乱码；括号块内避免 goto；正确处理路径参数的去引号与尾部反斜杠。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "写.*cmd.*脚本"
      - keyword: "写.*bat.*脚本"
      - keyword: "修复.*cmd.*乱码"
      - keyword: "cmd.*中文乱码"
      - keyword: "is not recognized"
      - keyword: "批处理.*goto"
      - keyword: "硬链接.*脚本"
      - keyword: "mklink"
      - keyword: "批处理.*脚本"
  execution:
    context: "inline"
    shell: "bash"
    environment:
      none
    artifacts:
      - "SKILL.md"
      - "references/utf8-garbled.md"
      - "references/goto-pitfall.md"
      - "references/path-handling.md"
      - "scripts/check_cmd_trailing.py"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
