interface:
  display_name: "会话经验固化"
  short_description: "从当前会话提取可复用经验并写回实际使用过的技能与规则"
  default_prompt: "使用 $session-lesson-distill 沉淀本次会话经验。先产出固化清单，经确认后写回目标文件。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "经验.*固化"
      - keyword: "沉淀.*技能"
      - keyword: "复盘.*坑"
      - keyword: "写回.*规则"
      - keyword: "沉淀.*经验"
  execution:
    context: "fork"
    shell: "powershell"
    environment:
      python: ">=3.8"
    artifacts:
      - "SKILL.md"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: tool-session-lesson-distill
version: "1.0"
mode: Production
