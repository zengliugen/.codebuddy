interface:
  display_name: "Directory Zip Export"
  short_description: "导出 git 仓库内目录为 zip 压缩包，遵循 gitignore 过滤，支持强制包含被忽略文件"
  default_prompt: "使用 $export-zipped-dir 将 git 仓库内目录导出为 zip 压缩包。将用户指定的源目录路径传递给技能，脚本会自动处理 gitignore 过滤与打包。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "导出.*目录"
      - keyword: "导出.*zip"
      - keyword: "打包.*目录"
      - keyword: "压缩.*目录"
  execution:
    context: "inline"
    shell: "bash"
    environment:
      python: ">=3.8"
    artifacts:
      - "SKILL.md"
      - "scripts/export_zipped_dir.py"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
